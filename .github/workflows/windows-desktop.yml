name: Windows EXE and installer
on:
  push:
    branches: [main, fix/powershell-host-result]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: netzblick-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE with embedded libraries
        shell: powershell
        run: ./tools/Build-Desktop.ps1
      - name: Release selection without network or credentials
        shell: powershell
        run: ./tools/Test-Updates.ps1
      - name: Download-marked portable EXE startup and capture
        timeout-minutes: 3
        shell: powershell
        run: ./tools/Test-Desktop.ps1
      - name: Package portable version
        shell: powershell
        run: |
          Remove-Item dist/Netzblick-Daten -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/Netzblick.exe,dist/Netzblick.exe.config,dist/README.md,dist/PRUEFSTAND.txt,dist/THIRD-PARTY-NOTICES.txt,dist/licenses -DestinationPath Netzblick-Portable-0.10.0-win-x64.zip
      - name: Compile installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup fehlt auf dem Windows-Runner.' }
          & $iscc installer/Netzblick.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer-Kompilierung fehlgeschlagen.' }
      - name: Install, update, run and uninstall
        shell: powershell
        run: |
          $before = Get-Culture
          try {
            Set-Culture de-DE
            ./tools/Test-Installer.ps1 -ExpectedCulture de-DE
          } finally { Set-Culture $before.Name }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Netzblick-0.10.0-win-x64
          path: |
            Netzblick-Portable-0.10.0-win-x64.zip
            dist-install/Netzblick-Setup-0.10.0-win-x64.exe
      - name: Publish tested packages as draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.10.0-build-${{ github.run_number }}'
          gh release create $tag --draft --target '${{ github.sha }}' --title 'Netzblick 0.10.0 – EXE, portable und Setup' --notes 'Entwicklungsversion. Portable EXE mit Internetmarkierung sowie Installation, Update, Start und Deinstallation auf Windows geprüft. Weitere Firewall-Gerätetests siehe PRUEFSTAND.txt.' Netzblick-Portable-0.10.0-win-x64.zip dist-install/Netzblick-Setup-0.10.0-win-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Pakete konnten nicht als Entwurf bereitgestellt werden.' }
